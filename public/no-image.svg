<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 215" width="460" height="215">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="460" height="215" rx="0" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="0.5"/>
  </pattern>
  <rect width="460" height="215" fill="url(#grid)"/>

  <!-- Gamepad icon (centered, above text) -->
  <g transform="translate(194, 50)" fill="none" stroke="#f0b100" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6">
    <!-- Controller body -->
    <path d="M8 10 C8 4 16 0 36 0 C56 0 64 4 64 10 L68 38 C70 48 60 52 54 44 L50 38 L22 38 L18 44 C12 52 2 48 4 38 Z" />
    <!-- D-pad horizontal -->
    <line x1="18" y1="18" x2="30" y2="18" />
    <!-- D-pad vertical -->
    <line x1="24" y1="12" x2="24" y2="24" />
    <!-- Buttons -->
    <circle cx="46" cy="12" r="2.5" fill="#f0b100" />
    <circle cx="52" cy="18" r="2.5" fill="#f0b100" />
    <circle cx="46" cy="24" r="2.5" fill="#f0b100" />
    <circle cx="40" cy="18" r="2.5" fill="#f0b100" />
  </g>

  <!-- "No Image Available" text -->
  <text x="230" y="140" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#888888" letter-spacing="1.5">
    NO IMAGE AVAILABLE
  </text>

  <!-- Subtle bottom accent line -->
  <rect x="180" y="160" width="100" height="1" rx="0.5" fill="#f0b100" opacity="0.25"/>
</svg>
